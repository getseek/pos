name: Documentation checks and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install exact hashed dependencies
        run: ./scripts/Initialize-Environment.ps1 -PythonPath (Get-Command python).Source
      - name: Check environment
        run: ./scripts/Check-Environment.ps1
      - name: Build and validate staged output
        run: ./scripts/Build-Docs.ps1
      - name: Run documentation regression checks
        run: ./scripts/Test-Docs.ps1
      - name: Confirm source and output freshness
        run: ./scripts/Validate-Docs.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: premium-pos-site-${{ github.sha }}
          path: .build/site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: premium-pos-site-${{ github.sha }}
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
